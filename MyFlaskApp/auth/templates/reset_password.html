{% extends "_auth_base.html" %}
{% block content %}
  <div class="card-heading"><span class="eyebrow">Account recovery</span><h2 id="form-title">Set a new password</h2><p>Choose a password you haven't used for this account.</p></div>
  <form method="post" action="{{ url_for('auth.reset_password') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters"><button type="button" class="reveal" data-password-toggle="password" aria-label="Show password">Show</button></div>
    <label for="confirm_password">Confirm new password</label><div class="password-field"><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required placeholder="Repeat your password"><button type="button" class="reveal" data-password-toggle="confirm_password" aria-label="Show password">Show</button></div>
    <button type="submit" class="button primary">Save New Password</button>
  </form>
{% endblock %}
