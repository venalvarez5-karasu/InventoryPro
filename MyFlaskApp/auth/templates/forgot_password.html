{% extends "_auth_base.html" %}
{% block content %}
  <div class="card-heading"><span class="eyebrow">Account recovery</span><h2 id="form-title">Forgot password?</h2><p>Enter your email address and we'll send a reset code if your account is verified.</p></div>
  <form method="post" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email address</label><input id="email" name="email" type="email" maxlength="190" autocomplete="email" required placeholder="you@example.com">
    <button class="button primary" type="submit">Send Reset Code</button>
  </form>
  <p class="bottom-note"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
{% endblock %}
